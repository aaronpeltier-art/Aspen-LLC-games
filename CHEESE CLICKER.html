<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Acres: Empire 🌿</title>
    <style>
        :root {
            --grass: #91cf60;
            --dirt: #8b5a2b;
            --text: #2d4a22;
            --accent: #ffb703;
            --shop-bg: #fff3e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f9eb;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .header { text-align: center; margin-bottom: 5px; }

        /* --- Save UI --- */
        .save-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .save-controls button {
            background-color: #457b9d;
            width: auto;
            padding: 5px 15px;
            font-size: 0.9rem;
            margin: 0;
        }
        
        .save-controls button.danger { background-color: #e63946; }
        .save-controls button:hover { opacity: 0.8; }

        .stats-container {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        .stats {
            font-size: 1.5rem;
            font-weight: bold;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: color 0.2s;
        }

        #btn-harvest-all {
            display: none; 
            background-color: #e63946;
            font-size: 1.2rem;
            padding: 10px 20px;
            width: auto;
            margin: 0;
        }
        #btn-harvest-all:hover { background-color: #d62828; }

        /* --- Multi-Grid Layout --- */
        #all-farms {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .farm-grid {
            display: grid;
            grid-template-columns: repeat(3, 80px); 
            grid-template-rows: repeat(3, 80px);
            gap: 10px;
            background: #a8dadc;
            padding: 10px;
            border-radius: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .plot {
            width: 80px;
            height: 80px;
            background-color: var(--grass);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.3s;
            user-select: none;
            border: 4px solid rgba(255,255,255,0.3);
        }

        .plot:hover { transform: scale(1.05); background-color: #a3d977; }
        .plot.empty { background-color: var(--dirt); }
        .plot.growing { background-color: #6d4c41; }
        .plot.ready { background-color: #d4a373; border-color: var(--accent); }

        /* --- Shop UI --- */
        .shop-toggle {
            background-color: #457b9d;
            font-size: 1.2rem;
            width: 250px;
            margin-bottom: 10px;
        }
        .shop
