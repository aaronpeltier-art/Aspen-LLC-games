<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLC MINCRAFT</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; background: #000; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 32px; pointer-events: none; z-index: 10; text-shadow: 2px 2px #000; }
        #blocker { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; cursor: pointer; text-align: center; }
        #hotbar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.75); padding: 12px; border: 5px solid #333; z-index: 50; border-radius: 4px; }
        .slot { width: 95px; height: 95px; border: 5px solid #555; display: flex; align-items: center; justify-content: center; color: white; font-size: 13px; font-weight: 900; text-align: center; background: #222; text-transform: uppercase; word-wrap: break-word; line-height: 1.1; }
        .slot.selected { border-color: #fff; background: #555; box-shadow: 0 0 25px rgba(255,255,255,0.5); }
        #inventory-menu { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #c6c6c6; border: 8px solid #444; padding: 40px; z-index: 200; width: 750px; max-height: 85vh; overflow-y: auto; color: #000; box-shadow: 20px 20px 0px rgba(0,0,0,0.4); }
        .inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        .inv-item { padding: 25px; background: #8b8b8b; border: 5px solid #555; cursor: pointer; text-align: center; color: white; font-size: 16px; font-weight: 900; transition: 0.1s; }
        .inv-item:hover { background: #fff; color: #000; transform: scale(1.05); }
        h1 { margin: 0 0 10px 0; font-size: 45px; }
    </style>
</head>
<body>
    <div id="blocker">
        <div id="welcome-ui">
            <h1>LLC MINCRAFT</h1>
            <p>CLICK ANYWHERE TO START</p>
            <p style="font-size: 18px; color: #aaa; margin-top: 20px;">WASD: Move | SPACE: Jump | F: Fly | E: Inventory</p>
        </div>
    </div>
    <div id="crosshair">+</div>
    <div id="inventory-menu"><h1>BLOCK GALLERY</h1><div class="inv-grid" id="inv-grid-list"></div></div>
    <div id="hotbar"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/PointerLockControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.PointerLockControls(camera, document.body);
        const handGroup = new THREE.Group();
        camera.add(handGroup);
        scene.add(camera);

        const ITEMS = [
            { name: 'GRASS', color: '#4dca44' }, { name: 'DIRT', color: '#8b4513' },
            { name: 'STONE', color: '#808080' }, { name: 'DEEPSLATE', color: '#333333' },
            { name: 'BEDROCK', color: '#111111', unbreakable: true },
            { name: 'OAK_LOG', color: '#5d4037' }, { name: 'LEAVES', color: '#228b22' },
            { name: 'CHERRY_LOG', color: '#ffd1dc' }, { name: 'CHERRY_LEAF', color: '#ffb7c5' },
            { name: 'AMETHYST', color: '#9a5cc6', emissive: '#220033' }, 
            { name: 'COPPER', color: '#d35400' }, { name: 'GOLD', color: '#f1c40f' }, 
            { name: 'DIAMOND', color: '#00ffff' }, { name: 'EMERALD', color: '#2ecc71' }, 
            { name: 'OBSIDIAN', color: '#1d1135' }, { name: 'NETHERRACK', color: '#730d0d' }, 
            { name: 'TNT', color: '#ff4444' }, { name: 'REDSTONE', color: '#ff0000', emissive: '#440000' }, 
            { name: 'LAMP', color: '#442200' },
            { name: 'GLASS', color: '#a2d2ff', transparent: true, opacity: 0.5 },
            { name: 'BEACON', color: '#ffffff' },
            { name: 'SWORD', color: '#00ffff', isTool: true }
        ];

        let hotbar = ITEMS.slice(0, 9);
        let activeSlot = 0;
        let isFlying = false;
        let velocity = new THREE.Vector3();
        let keys = {};
        const blocks = [];
        const entities = [];
        let spawnTimer = 0;

        function generateSwordTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
            const p = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
            for(let i=0; i<14; i++) {
                p(30+i*2, 30-i*2, 7, 7, '#000'); 
                p(32+i*2, 32-i*2, 4, 4, '#00ffff'); 
                p(32+i*2, 30-i*2, 3, 3, '#ccffff'); 
            }
            p(22, 34, 14, 14, '#5d4037'); p(34, 22, 14, 14, '#5d4037'); 
            for(let i=0; i<4; i++) p(10+i*4, 50-i*4, 8, 8, '#3d2b1f'); 
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; return tex;
        }
        const swordTexture = generateSwordTexture();

        function checkCollision(pos, radius = 0.42) {
            for (let b of blocks) {
                const bP = b.position;
                if (pos.x > bP.x - (0.5+radius) && pos.x < bP.x + (0.5+radius) &&
                    pos.z > bP.z - (0.5+radius) && pos.z < bP.z + (0.5+radius) &&
                    pos.y > bP.y - 1.58 && pos.y < bP.y + 0.58) return b;
            }
            return null;
        }

        function spawnAnimal(x, z, color) {
            const group = new THREE.Group();
            const bodyMat = new THREE.MeshLambertMaterial({color});
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 1.1), bodyMat);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.4), bodyMat);
            head.position.set(0, 0.45, 0.6);
            group.add(body, head);
            group.position.set(x, 2, z); 
            scene.add(group);
            entities.push({ mesh: group, vel: new THREE.Vector3(), timer: 0, dir: new THREE.Vector3(), health: 3, isHit: 0 });
        }

        function createBlock(x,y,z,item) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({
                color: item.color, transparent: !!item.transparent, opacity: item.opacity||1, emissive: item.emissive || 0x000000
            }));
            mesh.position.set(Math.round(x), Math.round(y), Math.round(z));
            mesh.userData = { item }; scene.add(mesh); blocks.push(mesh);
        }

        document.getElementById('blocker').addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => { document.getElementById('blocker').style.display = 'none'; });
        controls.addEventListener('unlock', () => { if(document.getElementById('inventory-menu').style.display !== 'block') document.getElementById('blocker').style.display = 'flex'; });

        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            const ray = new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(), camera);
            if (e.button === 0 && hotbar[activeSlot].isTool) {
                const entityHits = ray.intersectObjects(entities.map(e => e.mesh), true);
                if (entityHits.length > 0) {
                    const hitMesh = entityHits[0].object.parent;
                    const ent = entities.find(e => e.mesh === hitMesh);
                    if (ent) {
                        ent.health -= 1; ent.isHit = 10; ent.vel.y = 0.15;
                        if (ent.health <= 0) { scene.remove(ent.mesh); entities.splice(entities.indexOf(ent), 1); }
                    }
                    return;
                }
            }
            const hits = ray.intersectObjects(blocks);
            if (hits.length > 0) {
                const hit = hits[0];
                if (e.button === 0) {
                    if (hit.object.userData.item.unbreakable) return;
                    scene.remove(hit.object); blocks.splice(blocks.indexOf(hit.object), 1);
                } else if (e.button === 2) {
                    const item = hotbar[activeSlot];
                    if (!item.isTool) {
                        const n = hit.face.normal;
                        createBlock(hit.object.position.x+n.x, hit.object.position.y+n.y, hit.object.position.z+n.z, item);
                    }
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.key >= 1 && e.key <= 9) { activeSlot = e.key-1; updateUI(); updateHand(); }
            if (e.code === 'KeyF') { isFlying = !isFlying; velocity.y = 0; }
            if (e.code === 'KeyE') toggleInventory();
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                // SPAWN LOGIC: Keep 5 animals in world
                spawnTimer++;
                if (spawnTimer > 300 && entities.length < 5) {
                    spawnTimer = 0;
                    const rx = (Math.random() - 0.5) * 30;
                    const rz = (Math.random() - 0.5) * 30;
                    const color = Math.random() > 0.5 ? '#4b3621' : '#ffc0cb';
                    spawnAnimal(rx, 2, color);
                }

                const speed = isFlying ? 0.4 : 0.16;
                const prevPos = camera.position.clone();
                if (keys['KeyW']) controls.moveForward(speed);
                if (keys['KeyS']) controls.moveForward(-speed);
                if (keys['KeyA']) controls.moveRight(-speed);
                if (keys['KeyD']) controls.moveRight(speed);
                if (!isFlying && checkCollision(camera.position)) { camera.position.x = prevPos.x; camera.position.z = prevPos.z; }

                if (isFlying) {
                    if (keys['Space']) camera.position.y += 0.25;
                    if (keys['ShiftLeft']) camera.position.y -= 0.25;
                } else {
                    velocity.y -= 0.012; camera.position.y += velocity.y;
                    const ground = checkCollision(camera.position);
                    if (ground) {
                        if (velocity.y < 0) { camera.position.y = ground.position.y + 1.601; velocity.y = 0; if (keys['Space']) velocity.y = 0.24; }
                        else { camera.position.y = prevPos.y; velocity.y = 0; }
                    }
                    if (camera.position.y < 1.6) { camera.position.y = 1.6; velocity.y = 0; if (keys['Space']) velocity.y = 0.24; }
                }

                entities.forEach(ent => {
                    if (ent.isHit > 0) { ent.isHit--; ent.mesh.children.forEach(c => c.material.emissive.set(0xaa0000)); }
                    else { ent.mesh.children.forEach(c => c.material.emissive.set(0x000000)); }
                    
                    ent.timer--;
                    if (ent.timer <= 0) { ent.timer = 150; ent.dir.set(Math.random()-0.5, 0, Math.random()-0.5).normalize(); }
                    const oldE = ent.mesh.position.clone();
                    ent.mesh.position.addScaledVector(ent.dir, 0.025);
                    if (checkCollision(ent.mesh, 0.5)) ent.mesh.position.copy(oldE);
                    ent.mesh.lookAt(ent.mesh.position.clone().add(ent.dir));
                    
                    ent.vel.y -= 0.01; ent.mesh.position.y += ent.vel.y;
                    const eGround = checkCollision(ent.mesh, 0.5);
                    if (eGround) { ent.mesh.position.y = eGround.position.y + 0.601; ent.vel.y = 0; }
                    else if (ent.mesh.position.y < 0.6) { ent.mesh.position.y = 0.6; ent.vel.y = 0; }
                });
            }
            renderer.render(scene, camera);
        }

        function updateHand() {
            handGroup.clear();
            const it = hotbar[activeSlot];
            if (it?.isTool) {
                const s = new THREE.Sprite(new THREE.SpriteMaterial({map: swordTexture}));
                s.position.set(0.9, -0.6, -1.2); s.scale.set(1.6, 1.6, 1); handGroup.add(s);
            } else {
                const m = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), new THREE.MeshLambertMaterial({color:it.color}));
                m.position.set(0.7, -0.6, -1.1); handGroup.add(m);
            }
        }

        function updateUI() {
            const hb = document.getElementById('hotbar'); hb.innerHTML = '';
            hotbar.forEach((it, i) => {
                const s = document.createElement('div'); s.className = 'slot' + (i === activeSlot ? ' selected' : '');
                s.innerText = it.name; hb.appendChild(s);
            });
        }

        function toggleInventory() {
            const inv = document.getElementById('inventory-menu');
            if (controls.isLocked) { controls.unlock(); inv.style.display = 'block'; }
            else { controls.lock(); inv.style.display = 'none'; }
        }

        const list = document.getElementById('inv-grid-list');
        ITEMS.forEach(it => {
            const d = document.createElement('div'); d.className = 'inv-item'; d.innerText = it.name;
            d.onclick = () => { hotbar[activeSlot] = it; updateUI(); updateHand(); };
            list.appendChild(d);
        });

        for(let x=-15; x<15; x++) for(let z=-15; z<15; z++) createBlock(x, 0, z, ITEMS[0]);
        spawnAnimal(5, 5, '#4b3621'); 
        spawnAnimal(-5, -5, '#ffc0cb'); 
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        camera.position.set(0, 5, 0); updateUI(); updateHand(); animate();
        window.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
