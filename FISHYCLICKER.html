<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishy Clicker: OMEGA EDITION</title>
    <style>
        :root {
            --bg: #050b14;
            --panel: #101a26;
            --accent: #00d4ff;
            --gold: #ffcc00;
            --event: #ff00ff;
            --mega: #ff4500;
            --master: #7d00ff;
        }

        body {
            background-color: var(--bg);
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- Header & Nav --- */
        .header-stats {
            width: 100%; background: var(--panel); padding: 15px;
            display: flex; justify-content: space-around;
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 2px solid var(--accent); font-weight: bold;
        }

        nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding: 10px; background: #0a111a; width: 100%; }
        .nav-btn {
            background: #1c2e40; color: white; border: 1px solid var(--accent);
            padding: 8px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
        }
        .nav-btn.active { background: var(--accent); color: #000; }
        .save-btn { background: #2ecc71; border-color: #27ae60; font-weight: bold; }

        /* --- Screens --- */
        .screen { display: none; width: 95%; max-width: 800px; padding: 20px; box-sizing: border-box; }
        .active-screen { display: block; }

        /* --- Clicker Area --- */
        .click-zone { text-align: center; }
        #fish-btn { font-size: 7rem; background: none; border: none; cursor: pointer; transition: transform 0.1s; }
        #fish-btn:active { transform: scale(1.1); }
        #event-msg { height: 40px; color: var(--event); font-weight: bold; font-size: 1.2rem; text-shadow: 0 0 10px var(--event); }

        /* --- Hunt Popup --- */
        #hunt-popup {
            display: none; position: fixed; bottom: 20px; right: 20px;
            background: rgba(255, 69, 0, 0.9); padding: 20px; border-radius: 10px;
            color: white; font-weight: bold; cursor: pointer; z-index: 2000;
            animation: pulse 1.5s infinite; border: 2px solid white;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* --- Minigame UI --- */
        #minigame-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 3000; flex-direction: column; align-items: center; justify-content: center;
        }
        .fishing-bar-container { width: 80px; height: 350px; background: #222; position: relative; border: 4px solid #444; border-radius: 10px; }
        #catch-zone { width: 100%; height: 60px; background: var(--accent); position: absolute; bottom: 0; transition: background 0.2s; }
        #target-fish { width: 30px; height: 30px; background: #ffa500; position: absolute; left: 25px; border-radius: 50%; box-shadow: 0 0 15px orange; }
        #progress-bg { width: 200px; height: 20px; background: #333; margin-top: 20px; border-radius: 10px; }
        #progress-fill { width: 0%; height: 100%; background: #2ecc71; border-radius: 10px; }

        /* --- List Cards --- */
        .item-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; padding-right: 10px; }
        .card { background: var(--panel); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #333; }
       
        .card.master-card {
            border: 2px solid var(--master); background: linear-gradient(135deg, #101a26, #2d005e);
            box-shadow: 0 0 20px var(--master);
        }
        .master-btn { background: var(--master) !important; color: white !important; }
        .card.mega-pet { border-left: 5px solid var(--mega); background: linear-gradient(90deg, #101a26, #3d1200); box-shadow: 0 0 10px var(--mega); }

        .btn-buy { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-buy:disabled { background: #444; color: #888; cursor: not-allowed; }
        .price { color: var(--gold); display: block; font-size: 0.75rem; }
        .sell-bar { width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 8px; margin: 15px 0; }
    </style>
</head>
<body>

    <div id="minigame-overlay">
        <h1 id="mini-fish-name">HUNTING...</h1>
        <div class="fishing-bar-container">
            <div id="catch-zone"></div>
            <div id="target-fish"></div>
        </div>
        <div id="progress-bg"><div id="progress-fill"></div></div>
        <p>Keep the blue bar on the orange fish! <br> <b>[CLICK TO BOOST BAR]</b></p>
    </div>

    <div id="hunt-popup" onclick="startHunt()">A Hunt appeared! Click to start!</div>

    <div class="header-stats">
        <span>🐟 <span id="stat-fish">0</span></span>
        <span>💰 $<span id="stat-money">0</span></span>
    </div>

    <nav>
        <button class="nav-btn active" onclick="setTab('dock', this)">🌊 DOCK</button>
        <button class="nav-btn" onclick="setTab('rods', this)">🎣 RODS</button>
        <button class="nav-btn" onclick="setTab('travel', this)">🚁 TRAVEL</button>
        <button class="nav-btn" onclick="setTab('pets', this)">🐾 PETS</button>
        <button class="nav-btn" onclick="setTab('upgrades', this)">⚙️ UPGRADES</button>
        <button class="nav-btn save-btn" onclick="saveGame()">💾 SAVE</button>
    </nav>

    <div id="dock" class="screen active-screen">
        <div class="click-zone">
            <div id="event-msg"></div>
            <button id="fish-btn">🐟</button>
            <p><b>Rod:</b> <span id="cur-rod">Beginner</span> | <b>Pet:</b> <span id="cur-pet">None</span></p>
            <button class="sell-bar" onclick="sellAll()">SELL ALL FISH (x$<span id="cur-sell">1</span>)</button>
            <p id="auto-info">Passive: 0/sec</p>
        </div>
    </div>

    <div id="rods" class="screen"><div class="item-list" id="list-rods"></div></div>
    <div id="travel" class="screen"><div class="item-list" id="list-travel"></div></div>
    <div id="pets" class="screen"><div class="item-list" id="list-pets"></div></div>
    <div id="upgrades" class="screen"><div class="item-list" id="list-upgrades"></div></div>

    <script>
        let state = {
            fish: 0, money: 0, rodMult: 1, petMult: 1, sellValue: 1, autoRate: 0,
            rodsOwnedCount: 0, currentRodName: "Beginner", currentPetName: "None", currentEmoji: "🐟"
        };

        // --- EXPANDED DATA ---
        const RODS = Array.from({length: 30}, (_, i) => ({
            name: ["Plastic", "Bamboo", "Carbon", "Fiberglass", "Steel", "Graphite", "Heavy", "Twitchy", "Lucky", "Reinforced", "Golden", "Titanium", "Magma", "Cryo", "Obsidian", "Destiny", "Void", "Ancient", "Celestial", "Radiant", "Mythic", "Galactic", "Eternal", "Omega", "Fisch God", "Cosmic Hook", "Reality Breaker", "Infinity", "Singularity", "Ascended"][i] + " Rod",
            cost: Math.floor(50 * Math.pow(2.85, i)),
            type: i % 2 === 0 ? 'money' : 'fish',
            mult: Math.floor(2 * Math.pow(2.45, i))
        }));
        RODS.push({ name: "MASTERLINE", cost: 1e18, type: 'money', mult: 1e15, isMaster: true });

        const LOCATIONS = Array.from({length: 31}, (_, i) => ({
            name: ["Pond", "Lake", "River", "Bay", "Reef", "Ocean", "Deep Sea", "Abyss", "Volcano", "Arctic", "Swamp", "Space", "Orbit", "Moon", "Mars", "Saturn", "Sun", "Void", "Rift", "Hell", "Heaven", "Dreamscape", "Cyber", "Neon", "Dimension X", "Multiverse", "Finality", "Nexus", "Eternity", "The End", "The Source"][i],
            cost: i === 0 ? 0 : Math.floor(500 * Math.pow(2.9, i)),
            sell: Math.floor(1 * Math.pow(2.5, i)),
            icon: ["🐟","🐡","🐠","🦈","🐙","🐳","🦑","🐚","🔥","🌡️","🌋","🧊","❄️","🦎","🐊","👽","🚀","🌑","☄️","🪐","☀️","🌀","⚛️","👿","😇","💤","🤖","🌆","✨","🌈","🔱"][i]
        }));

        const PETS = [
            { name: "Wormy", cost: 1000, mult: 2 },
            { name: "Axolotl", cost: 50000, mult: 10 },
            { name: "Sea Dragon", cost: 500000000, mult: 500 },
            { name: "Kraken", cost: 1e12, mult: 10000 },
            { name: "Lil Meg", cost: 1e15, mult: 1e9, isMega: true }
        ];

        const UPGRADES = Array.from({length: 25}, (_, i) => ({
            name: `Auto-Fisher T${i+1}`, cost: Math.floor(100 * Math.pow(3.1, i)), rate: Math.floor(1 * Math.pow(3.6, i))
        }));

        // --- HUNT SYSTEM ---
        let gameActive = false, barPos = 0, barVel = 0, fishPos = 150, fishVel = 2.5, huntProgress = 0;
        let currentHuntFish = "";

        function triggerHuntPopup() {
            const fishes = ["GODZILLA FISH", "KRAKEN BEYOND", "VOID SHARK", "ULTRA MEG", "GLITCH OVERLORD"];
            currentHuntFish = fishes[Math.floor(Math.random()*fishes.length)];
            const popup = document.getElementById('hunt-popup');
            popup.innerText = `A ${currentHuntFish} has appeared! CLICK TO HUNT!`;
            popup.style.display = 'block';
            setTimeout(() => { popup.style.display = 'none'; }, 15000);
        }

        function startHunt() {
            document.getElementById('hunt-popup').style.display = 'none';
            if (state.currentRodName === "MASTERLINE") { winHunt(); return; }
            document.getElementById('minigame-overlay').style.display = 'flex';
            document.getElementById('mini-fish-name').innerText = `HUNTING: ${currentHuntFish}`;
            gameActive = true; huntProgress = 0; barPos = 250; barVel = 0;
            requestAnimationFrame(minigameLoop);
        }

        window.onmousedown = () => { if(gameActive) barVel -= 10; };

        function minigameLoop() {
            if(!gameActive) return;
            barVel += 0.5; barPos += barVel;
            if(barPos > 290) { barPos = 290; barVel = 0; }
            if(barPos < 0) { barPos = 0; barVel = 0; }
           
            fishPos += fishVel;
            if(fishPos > 320 || fishPos < 0) fishVel *= -1.02; // Speeds up slightly

            document.getElementById('catch-zone').style.top = barPos + "px";
            document.getElementById('target-fish').style.top = fishPos + "px";

            if(fishPos >= barPos && fishPos <= barPos + 60) {
                huntProgress += 0.5;
                document.getElementById('catch-zone').style.background = "#2ecc71";
            } else {
                huntProgress -= 0.3;
                document.getElementById('catch-zone').style.background = "#e74c3c";
            }

            document.getElementById('progress-fill').style.width = Math.max(0, huntProgress) + "%";

            if(huntProgress >= 100) winHunt();
            else if(huntProgress <= -20) failHunt();
            else requestAnimationFrame(minigameLoop);
        }

        function winHunt() {
            gameActive = false;
            document.getElementById('minigame-overlay').style.display = 'none';
            const reward = (state.money * 0.4) + (2000 * state.rodMult);
            state.money += reward;
            alert(`CAUGHT! You reeled in the ${currentHuntFish} for $${reward.toLocaleString()}!`);
            updateUI();
        }

        function failHunt() {
            gameActive = false;
            document.getElementById('minigame-overlay').style.display = 'none';
            alert("The fish snapped the line and escaped!");
        }

        // --- CORE LOGIC ---
        function setTab(id, btn) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active-screen');
            btn.classList.add('active');
        }

        document.getElementById('fish-btn').onclick = () => {
            state.fish += (1 * state.rodMult * state.petMult);
            if(Math.random() < 0.03) { // 3% chance for a click event
                state.money += state.money * 0.05 + 100;
                document.getElementById('event-msg').innerText = "✨ SHINY CATCH! +$$$";
                setTimeout(()=> document.getElementById('event-msg').innerText="", 1500);
            }
            updateUI();
        };

        function sellAll() { state.money += Math.floor(state.fish) * state.sellValue; state.fish = 0; updateUI(); }

        function buyItem(cat, i) {
            let item = (cat==='rod'?RODS[i]:cat==='pet'?PETS[i]:cat==='loc'?LOCATIONS[i]:UPGRADES[i]);
            let costType = (cat==='rod'?item.type:'money');
            if(state[costType] >= item.cost) {
                state[costType] -= item.cost;
                if(cat==='rod'){ state.rodMult = item.mult; state.currentRodName = item.name; state.rodsOwnedCount++; renderRods(); }
                if(cat==='pet'){ state.petMult = item.mult; state.currentPetName = item.name; }
                if(cat==='loc'){ state.sellValue = item.sell; state.currentEmoji = item.icon; }
                if(cat==='up'){ state.autoRate += item.rate; item.cost *= 2.6; renderUpgrades(); }
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('stat-fish').innerText = Math.floor(state.fish).toLocaleString();
            document.getElementById('stat-money').innerText = Math.floor(state.money).toLocaleString();
            document.getElementById('cur-sell').innerText = state.sellValue.toLocaleString();
            document.getElementById('cur-rod').innerText = state.currentRodName;
            document.getElementById('cur-pet').innerText = state.currentPetName;
            document.getElementById('fish-btn').innerText = state.currentEmoji;
            document.getElementById('auto-info').innerText = `Passive: ${(state.autoRate * state.rodMult).toLocaleString()}/sec`;
        }

        function renderRods() {
            const list = document.getElementById('list-rods'); list.innerHTML = "";
            RODS.forEach((r, i) => {
                if(r.isMaster && state.rodsOwnedCount < 30) return;
                list.innerHTML += `<div class="card ${r.isMaster?'master-card':''}">
                    <div><b>${r.name}</b><br><span>x${r.mult.toLocaleString()}</span></div>
                    <button class="btn-buy ${r.isMaster?'master-btn':''}" onclick="buyItem('rod', ${i})"><span class="price">${r.cost.toLocaleString()}</span>BUY</button>
                </div>`;
            });
        }

        function renderUpgrades() {
            const list = document.getElementById('list-upgrades'); list.innerHTML = "";
            UPGRADES.forEach((u, i) => {
                list.innerHTML += `<div class="card"><div><b>${u.name}</b><br><span>+${u.rate.toLocaleString()}/s</span></div><button class="btn-buy" onclick="buyItem('up', ${i})"><span class="price">$${u.cost.toLocaleString()}</span>BUY</button></div>`;
            });
        }

        function saveGame() { localStorage.setItem('fishyOmegaSave', JSON.stringify(state)); alert("GAME SAVED!"); }
        function loadGame() { const s = localStorage.getItem('fishyOmegaSave'); if(s){ state = JSON.parse(s); updateUI(); renderRods(); renderUpgrades(); } }

        setInterval(() => { if(state.autoRate > 0) { state.fish += (state.autoRate * state.rodMult) / 10; updateUI(); } }, 100);
        setInterval(triggerHuntPopup, 90000); // Hunt every 90 seconds

        window.onload = () => {
            const listP = document.getElementById('list-pets');
            PETS.forEach((p, i) => listP.innerHTML += `<div class="card ${p.isMega?'mega-pet':''}"><div><b>${p.name}</b><br><span>x${p.mult.toLocaleString()}</span></div><button class="btn-buy" onclick="buyItem('pet', ${i})"><span class="price">$${p.cost.toLocaleString()}</span>BUY</button></div>`);
            const listT = document.getElementById('list-travel');
            LOCATIONS.forEach((l, i) => listT.innerHTML += `<div class="card"><div><b>${l.icon} ${l.name}</b></div><button class="btn-buy" onclick="buyItem('loc', ${i})"><span class="price">$${l.cost.toLocaleString()}</span>GO</button></div>`);
            loadGame(); renderRods(); renderUpgrades(); updateUI();
        };
    </script>
</body>
</html>
