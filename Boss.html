<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KALEIDOSCOPE OMNIVERSE</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { 
            display: block; 
            filter: contrast(1.6) brightness(1.3) saturate(2);
        }
    </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let pulses = [];
    let isMouseDown = false;
    let frame = 0;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.onresize = resize;
    resize();

    window.onmousedown = (e) => {
        isMouseDown = true;
        pulses.push(new Pulse(e.clientX, e.clientY));
    };
    window.onmouseup = () => isMouseDown = false;

    class Pulse {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.r = 0; this.life = 1.0;
        }
        update() { this.r += 12; this.life -= 0.015; }
    }

    class Particle {
        constructor() { this.init(); }
        init() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4;
            this.h = Math.random() * 360;
        }
        update(m, activePulses) {
            activePulses.forEach(p => {
                let dx = this.x - p.x;
                let dy = this.y - p.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if (Math.abs(dist - p.r) < 30) {
                    this.vx += (dx / dist) * 8;
                    this.vy += (dy / dist) * 8;
                }
            });

            if (isMouseDown) {
                let dx = m.x - this.x;
                let dy = m.y - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                this.vx += (dx / dist) * 0.6;
                this.vy += (dy / dist) * 0.6;
            }

            this.vx *= 0.96;
            this.vy *= 0.96;
            this.x += this.vx;
            this.y += this.vy;

            if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
    }

    for(let i = 0; i < 120; i++) particles.push(new Particle());
    const mouse = { x: 0, y: 0 };
    window.onmousemove = e => { mouse.x = e.clientX; mouse.y = e.clientY; };
